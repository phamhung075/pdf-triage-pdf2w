root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = ["serve"]
  bin = "./tmp/pdf-triage"
  cmd = "go build -trimpath -o ./tmp/pdf-triage ./cmd/pdf-triage"
  delay = 500
  entrypoint = ["./tmp/pdf-triage"]
  exclude_dir = ["tmp", "vendor", "dist", ".git"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  kill_delay = "500ms"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
